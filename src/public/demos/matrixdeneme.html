<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Editing Workspace</title>
    <link rel="stylesheet" href="matrix-editing.css">
</head>

<body>

    <nav class="top-bar">
        <h2>Matrix Editing Interface</h2>
    </nav>

    <div class="main-content">

        <aside class="left-panel">
            <h3>Matrix Tools</h3>
            <div id="widget-menu-container"></div>
        </aside>

        <main class="middle-panel">
            <div class="middle-top" style="background: #1e1e24; color: #fff; padding: 15px; border-radius: 6px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="margin: 0; font-family: monospace;">64×64 LED Matrix Panel (P3.0 192x192mm)</h3>
                    <div>
                        <select id="sim-driver-select"
                            style="padding: 4px; background: #2c2c35; color: #fff; border: 1px solid #444; border-radius: 4px; font-family: monospace;">
                            <option value="local">Local Driver (JS Render)</option>
                            <option value="network">Network Driver (Python/C++ Pipe)</option>
                            <option value="media">Media Driver (Image/Video)</option>
                            <option value="disabled">Disable Panel</option>
                        </select>
                    </div>
                </div>

                <div id="simulation-container"
                    style="display: flex; justify-content: center; align-items: center; background: #000; padding: 15px; border-radius: 4px; border: 1px solid #333;">
                    <canvas id="matrix-canvas" width="256" height="256"
                        style="background: #050505; box-shadow: inset 0 0 10px #000;"></canvas>
                </div>
            </div>
            <div class="middle-bottom">
                
                <!-- PLAYBACK VE SCRUBBING BAR KATMANI -->
                <div class="timeline-control-bar">
                    <div class="control-left">
                        <button id="timeline-play-btn" class="control-btn" title="Durdur/Oynat">
                            <span class="icon">▶</span> Oynat
                        </button>

                        <div class="mode-select-wrapper">
                            <select id="timeline-mode-dropdown">
                                <option value="timeline-normal" selected>Normal Mode</option>
                                <option value="timeline-song">Song Playing Mode</option>
                                <option value="timeline-custom">Custom Mode</option>
                            </select>
                        </div>
                    </div>

                    <div class="control-middle" style="flex: 1; display: flex; align-items: center; gap: 10px; margin: 0 20px;">
                        <span id="current-time-text" style="font-family: monospace; font-weight: bold; min-width: 45px; color:#00F5FF;">0.0s</span>
                        <input type="range" id="global-scrubber" min="0" max="100" value="0" step="0.1" style="flex: 1; cursor: pointer;">
                    </div>

                    <div class="control-right">
                        <div class="timeline-info">
                            <span>Total Duration: <strong id="total-duration">0s</strong></span>
                        </div>
                    </div>
                </div>

                <div class="timeline-content-area">
                    <div id="timeline-normal" class="timeline-view active-view">
                        <p>Drag widgets here to build your sequence.</p>
                    </div>
                    <div id="timeline-song" class="timeline-view">
                        <p>Drag widgets here to build your sequence.</p>
                    </div>
                    <div id="timeline-custom" class="timeline-view">
                        <p>Drag widgets here to build your sequence.</p>
                    </div>
                </div>
            </div>
        </main>

        <aside class="right-panel">
            <h3>Properties</h3>
            <div id="properties-container">
                <p>Select a dropped widget to see properties.</p>
            </div>
        </aside>

    </div>

    <script src="matrix-editing.js"></script>
</body>

</html>
