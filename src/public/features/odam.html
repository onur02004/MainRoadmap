<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odam - Güvenli Kamera Paneli</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .badge-off { background: #ef4444; color: #fff; }
        .badge-on { background: #22c55e; color: #fff; }
        
        .video-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Debug Console */
        .console-box {
            margin-top: 25px;
            background: #1e293b;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #334155;
        }
        .console-header {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #94a3b8;
        }
        .console-logs {
            background: #020617;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.8rem;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            border-radius: 4px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Oda Kamera Paneli</h2>
        <span id="statusBadge" class="badge badge-off">Kamera Pasif</span>
    </div>

    <div class="video-box">
        <!-- Akış doğrudan korumalı endpoint'e bağlanır -->
        <img id="streamImg" src="/odam/stream" alt="Kamera Başlatılıyor..." />
    </div>

    <!-- Hata Ayıklama & Log Konsolu -->
    <div class="console-box">
        <div class="console-header">ustreamer Canlı Konsol Çıktısı (Debug)</div>
        <div id="logOutput" class="console-logs">Loglar yükleniyor...</div>
    </div>
</div>

<script>
    const statusBadge = document.getElementById('statusBadge');
    const logOutput = document.getElementById('logOutput');

    // Her 2 saniyede bir kamera durumunu ve ustreamer loglarını çeker
    async function fetchLogs() {
        try {
            const res = await fetch('/odam/logs');
            if (res.ok) {
                const data = await res.json();
                
                // Durum rozetini güncelle
                if (data.active) {
                    statusBadge.textContent = `Kamera Aktif (${data.watchers} İzleyici)`;
                    statusBadge.className = 'badge badge-on';
                } else {
                    statusBadge.textContent = 'Kamera Pasif';
                    statusBadge.className = 'badge badge-off';
                }

                // Logları konsola yazdır
                logOutput.textContent = data.logs.length > 0 
                    ? data.logs.join('\n') 
                    : 'Henüz log kaydı yok...';
                
                // Otomatik en aşağı kaydır
                logOutput.scrollTop = logOutput.scrollHeight;
            }
        } catch (err) {
            logOutput.textContent = 'Loglar alınırken hata oluştu: ' + err.message;
        }
    }

    setInterval(fetchLogs, 2000);
    fetchLogs();
</script>

</body>
</html>
