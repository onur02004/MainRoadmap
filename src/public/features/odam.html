<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oda Kontrol Merkezi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --terminal-bg: #020617;
            --terminal-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-red);
        }

        .status-dot.active {
            background-color: var(--terminal-green);
        }

        /* 2 Sütunlu Izgara Yapısı */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Sol Taraf: Kameralar */
        .cameras-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .camera-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .camera-header {
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .camera-viewport {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .camera-viewport img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-placeholder {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Sağ Taraf: Loglar ve Kontroller */
        .sidebar-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Log Terminal Paneli */
        .terminal-box {
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.775rem;
            color: var(--terminal-green);
            height: 320px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .terminal-line {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        /* Buton Grubu */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent-blue);
        }
        .btn-primary:hover {
            background-color: var(--accent-blue-hover);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Oda Kontrol Panel</h1>
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Bağlanıyor...</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- SOL SÜTUN: Kameralar -->
        <div class="cameras-column">
            <!-- Kamera 1 -->
            <div class="camera-card">
                <div class="camera-header">
                    <span>Kamera 1 (Canlı Akış)</span>
                    <span id="watcherCount" style="font-size: 0.8rem;">İzleyici: 0</span>
                </div>
                <div class="camera-viewport">
                    <img id="camFeed1" src="/odam/stream" alt="Kamera 1 Yayın" onerror="this.style.display='none'; document.getElementById('camPlaceholder1').style.display='block';">
                    <div id="camPlaceholder1" class="camera-placeholder" style="display: none;">Kamera 1 Yayını Yok</div>
                </div>
            </div>

            <!-- Kamera 2 (Gelecekteki Kamera Bağlantısı İçin) -->
            <div class="camera-card">
                <div class="camera-header">
                    <span>Kamera 2</span>
                    <span style="font-size: 0.8rem; color: #64748b;">Devre Dışı</span>
                </div>
                <div class="camera-viewport">
                    <div class="camera-placeholder">Kamera 2 Bağlı Değil</div>
                </div>
            </div>
        </div>

        <!-- SAĞ SÜTUN: Loglar ve Hızlı Eylemler -->
        <div class="sidebar-column">
            <!-- Log Paneli -->
            <div class="panel-card">
                <div class="panel-title">Sistem Logları</div>
                <div class="terminal-box" id="terminal">
                    <div class="terminal-line">[Sistem] Konsol hazırlandı...</div>
                </div>
            </div>

            <!-- Hızlı Eylemler & Işık Kontrolleri -->
            <div class="panel-card">
                <div class="panel-title">Oda Kontrolleri</div>
                <div class="controls-grid">
                    <button class="btn btn-primary" onclick="triggerAction('led_on')">💡 Işık Aç</button>
                    <button class="btn" onclick="triggerAction('led_off')">🌙 Işık Kapa</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById("terminal");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        const watcherCount = document.getElementById("watcherCount");

        // Logları periyodik olarak çek
        async function fetchLogs() {
            try {
                const res = await fetch("/odam/logs");
                if (!res.ok) return;

                const data = await res.json();
                
                // Durum göstergesi güncelle
                if (data.active) {
                    statusDot.classList.add("active");
                    statusText.textContent = "Kamera Aktif";
                } else {
                    statusDot.classList.remove("active");
                    statusText.textContent = "Kamera Pasif";
                }

                watcherCount.textContent = `İzleyici: ${data.watchers}`;

                // Logları terminale bas ve en alta kaydır
                if (data.logs && data.logs.length > 0) {
                    terminal.innerHTML = data.logs.map(log => `<div class="terminal-line">${escapeHtml(log)}</div>`).join('');
                    terminal.scrollTop = terminal.scrollHeight;
                }
            } catch (err) {
                console.error("Loglar çekilemedi:", err);
            }
        }

        // Işık ve Cihaz Kontrolü Eylemleri (Backend LED API'sine İstek Atar)
        async function triggerAction(action) {
            try {
                // Not: deviceId değerini kendi LED cihazınızın UUID'si ile değiştirebilirsiniz
                const res = await fetch("/api/device-actions/YOUR_DEVICE_UUID/" + (action === 'led_on' ? 'on' : 'off'), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });
                
                if (res.ok) {
                    console.log(`[Eylem] ${action} başarıyla gönderildi.`);
                } else {
                    console.error("Eylem başarısız oldu.");
                }
            } catch (e) {
                console.error("İstek atılırken hata:", e);
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Her 2 saniyede bir logları ve canlı durumları çek
        setInterval(fetchLogs, 2000);
        fetchLogs();
    </script>
</body>
</html>
